[package]
name = "lumoscore-router"
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
description = "LumosCore swap router: the 0.2% fee is taken only when the Rhea swap succeeds."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
