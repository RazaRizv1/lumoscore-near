# NEAR pool indexer: every Rhea pool's swaps, deposits and withdrawals, read off the chain each minute.
# Deploy:  cd workers/near-pool-indexer && npx wrangler deploy
# Schema:  npx wrangler d1 execute lumoscore-near-pooltxs --remote --file=schema.sql
# Status:  https://near-pool-indexer.<subdomain>.workers.dev/status
name = "near-pool-indexer"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Every minute. Reads NEAR Lake (S3, requester pays); needs the secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY (wrangler secret put ...). Without them each run stops at once and logs why.
[triggers]
crons = ["* * * * *", "*/2 * * * *", "1-59/2 * * * *", "*/5 * * * *"]   # the last two: participant counts only (src/index.js lpJob), every minute between them

[[d1_databases]]
binding = "DB"
database_name = "lumoscore-near-pooltxs"
database_id = "52dc5bcf-e8fb-4399-8445-13231a91e2c8"

[observability]
enabled = true
